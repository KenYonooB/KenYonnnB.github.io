<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>LiteKit · 个人数字实验室与效率作品集</title>
<meta name="description" content="捕捉日常高频痛点，构建免登录、纯本地运行的极简效率工具集与产品造物复盘。" />
<style>html,body{background-color:#0a0a0b;color:#f1f8fa;color-scheme:dark}</style>
<link rel="stylesheet" href="./assets/css/site-glass.css" />
<link rel="stylesheet" href="./assets/css/tools-suite.css" />
<style>
  /* ===================== 1. 设计令牌 ===================== */
  :root{
    --bg:var(--site-glass-strong); --bg-soft:rgba(213,240,252,.08);
    --bg-sunken:rgba(5,15,23,.22); --surface:var(--site-glass);
    --ink:var(--site-text); --ink-2:#e0edf1; --ink-3:#d2e2e9; --ink-4:var(--site-muted);
    --line:var(--site-edge); --line-2:rgba(216,240,255,.35);
    --accent:#3157b6; --accent-hover:#25499e; --accent-ink:var(--site-link);
    --accent-soft:rgba(73,110,192,.16); --accent-line:rgba(150,190,255,.42);
    --ok-bg:rgba(37,119,77,.16); --ok-line:rgba(128,226,174,.40); --ok-ink:#a9f1c3; --ok-dot:#72e3a4;
    --do-bg:var(--accent-soft); --do-line:var(--accent-line); --do-ink:#c6dfff; --do-dot:#9bb7ff;
    --pd-bg:rgba(163,105,19,.15); --pd-line:rgba(242,193,103,.40); --pd-ink:#ffe0a1; --pd-dot:#f1be6f;
    --df-bg:var(--bg-soft); --df-line:var(--line); --df-ink:var(--ink-3); --df-dot:#becbd9;
    --wn-bg:rgba(177,65,61,.15); --wn-line:rgba(255,172,164,.40); --wn-ink:#ffc4bd;
    --code-bg:var(--site-glass-strong); --code-ink:#e6edf7; --code-dim:#c5d5e5;
    --code-key:#b5d8ff; --code-str:#b8edbd; --code-num:#ffe0a1;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
    --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-md:16px;
    --fs-lg:18px; --fs-xl:21px; --fs-2xl:26px; --fs-3xl:34px;
    --r-xs:5px; --r-sm:7px; --r:10px; --r-lg:14px; --r-pill:99px;
    --sh-1:0 1px 2px rgba(16,24,40,.06);
    --sh-2:0 4px 14px rgba(10,16,28,.18);
    --sh-3:0 14px 36px rgba(6,10,18,.28);
    --ease:cubic-bezier(.4,0,.2,1);
  }

  /* ===================== 2. 基础 ===================== */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    color:var(--ink); font-family:var(--sans);
    font-size:var(--fs-base); line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--accent-ink); text-decoration:none}
  a:hover{text-decoration:underline}
  a.btn:hover, a.card:hover, a.row:hover, a.link:hover, a.logo:hover, a.bento-card:hover{text-decoration:none}
  a.card, a.row, a.logo, a.bento-card{color:inherit}
  a.card{display:block}
  h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.011em}
  p{margin:0}
  .ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  .ic.sm{width:14px;height:14px;stroke-width:2}
  .ic.lg{width:19px;height:19px;stroke-width:1.7}
  .ic.fill{fill:currentColor;stroke:none}

  /* ===================== 3. 画布与主框架 ===================== */
  .stage{
    --stage-top:26px; --stage-side:18px; --stage-bottom:68px;
    position:relative; padding:var(--stage-top) var(--stage-side) var(--stage-bottom);
    padding:calc(var(--stage-top) + var(--site-safe-top)) calc(var(--stage-side) + var(--site-safe-right))
      calc(var(--stage-bottom) + var(--site-safe-bottom)) calc(var(--stage-side) + var(--site-safe-left));
    display:flex; justify-content:center;
  }
  .ocean-toggle[hidden], .ocean-toggle:not(.is-paused) .ocean-play,
  .ocean-toggle.is-paused .ocean-pause{display:none}
  .screen{
    width:1280px; max-width:100%; border:1px solid var(--line);
    border-radius:var(--r-lg); overflow:hidden; display:flex; flex-direction:column;
    box-shadow:var(--sh-3);
  }

  /* ===================== 4. 顶部导航 ===================== */
  .nav{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:0 32px; height:66px; background:var(--bg);
    border-bottom:1px solid var(--line); flex:none;
  }
  .nav .logo{white-space:nowrap; display:flex; align-items:center; gap:10px; font-weight:700; font-size:var(--fs-lg); letter-spacing:-.015em}
  .nav .logo .mark{
    width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    font-family:var(--mono); letter-spacing:0; box-shadow:0 2px 10px rgba(49,87,182,.45);
  }
  .nav .logo .sub{font-size:var(--fs-xs); font-weight:500; color:var(--ink-4); margin-left:2px}
  .nav .links{display:flex; gap:4px; align-items:center}
  .nav .links a{
    color:var(--ink-2); font-size:var(--fs-base); padding:6px 13px; border-radius:var(--r-sm);
    cursor:pointer; transition:background .15s var(--ease), color .15s var(--ease);
  }
  .nav .links a:hover{background:var(--bg-soft); color:var(--ink); text-decoration:none}
  .nav .links a.cur{color:var(--accent-ink); font-weight:600; background:var(--accent-soft)}
  .nav .right{display:flex; gap:10px; align-items:center}
  .search{
    width:236px; height:38px; border-radius:var(--r-pill); background:var(--bg-soft);
    border:1px solid var(--line); display:flex; align-items:center; gap:8px;
    padding:0 12px 0 14px; color:var(--ink-3); font-size:var(--fs-sm);
    cursor:pointer; text-align:left; font-family:inherit;
    transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .search:hover{border-color:var(--line-2); color:var(--ink-2); background:var(--bg-sunken)}
  .search .kbd{
    margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-4);
    border:1px solid var(--line); border-radius:var(--r-xs); padding:1px 5px; background:var(--bg);
  }
  .icon-btn{
    width:38px;height:38px;border-radius:var(--r-pill);background:var(--bg-soft);
    border:1px solid var(--line); color:var(--ink-2); cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .icon-btn:hover{border-color:var(--line-2); color:var(--ink); background:var(--bg-sunken)}
  .burger{display:none}

  /* ===================== 5. 侧栏与主区 ===================== */
  .body{display:flex; flex:1; min-height:780px}
  .side{
    width:254px; flex:none; padding:22px 14px 22px 18px; background:var(--bg-soft);
    border-right:1px solid var(--line); font-size:var(--fs-sm); color:var(--ink-2);
  }
  .side .grp{
    font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-4); margin:20px 0 6px; padding-left:10px;
  }
  .side .grp:first-child{margin-top:0}
  .side a{
    display:flex; align-items:center; gap:8px; color:var(--ink-2); padding:7px 10px;
    border-radius:var(--r-sm); cursor:pointer; position:relative; line-height:1.45;
    transition:background .13s var(--ease), color .13s var(--ease);
  }
  .side a:hover{background:var(--bg-sunken); color:var(--ink); text-decoration:none}
  .side a.ind1{padding-left:16px}
  .side a.cur{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
  .side a.cur::before{
    content:''; position:absolute; left:0; top:6px; bottom:6px; width:3px;
    border-radius:0 3px 3px 0; background:var(--accent);
  }
  .side .cnt{margin-left:auto; font-size:11px; color:var(--ink-4); font-family:var(--mono)}
  .scrim{display:none}
  .main{flex:1; min-width:0; padding:32px 38px 44px; display:flex; flex-direction:column; gap:18px}

  /* ===================== 6. 通用元件 ===================== */
  .crumb{display:flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--ink-3); flex-wrap:wrap}
  .crumb .ic{width:13px;height:13px}
  h1.page{font-size:var(--fs-2xl); line-height:1.3; margin:0}
  .lead{font-size:var(--fs-base); color:var(--ink-3); margin:0; max-width:76ch; line-height:1.7}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:18px 20px; box-shadow:var(--sh-1); transition:box-shadow .18s var(--ease), border-color .18s var(--ease);
  }
  .card.hl{background:var(--accent-soft); border-color:var(--accent-line); box-shadow:none}
  .card.plain{background:var(--bg-soft); box-shadow:none}
  .card.linkable{cursor:pointer}
  .card.linkable:hover{border-color:var(--line-2); box-shadow:var(--sh-2)}
  .card h3{font-size:var(--fs-md); margin-bottom:6px}
  .card .meta{font-size:var(--fs-sm); color:var(--ink-3)}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .sec-h{display:flex; align-items:center; gap:8px; font-size:var(--fs-sm); font-weight:600; color:var(--ink-2)}
  .lbl-c{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-4)}

  .tag{
    display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-xs); font-weight:500;
    padding:2px 9px; border-radius:var(--r-pill); border:1px solid var(--line);
    color:var(--ink-2); background:var(--bg-soft); white-space:nowrap;
  }
  .tag .d{width:6px;height:6px;border-radius:99px;background:currentColor;flex:none}
  .tag.done{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok-ink)}
  .tag.doing{background:var(--do-bg); border-color:var(--do-line); color:var(--do-ink)}
  .tag.todo{background:var(--df-bg); border-color:var(--df-line); color:var(--df-ink)}
  .tag.pending{background:var(--pd-bg); border-color:var(--pd-line); color:var(--pd-ink)}

  .btn{
    font:inherit; font-size:var(--fs-base); height:44px; min-width:154px; padding:0 18px;
    border-radius:var(--r-sm); border:1px solid transparent; cursor:pointer; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:background .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease);
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent); color:#fff}
  .btn.primary:hover{background:var(--accent-hover); text-decoration:none}
  .btn.ghost{background:var(--bg); color:var(--ink); border-color:var(--line-2)}
  .btn.ghost:hover{background:var(--bg-soft); border-color:var(--ink-4); text-decoration:none}
  .btn.sm{height:34px; min-width:0; padding:0 13px; font-size:var(--fs-xs)}
  .btns{display:flex; gap:11px; flex-wrap:wrap}
  .link{
    color:var(--accent-ink); cursor:pointer; display:inline-flex; align-items:center; gap:5px;
    font-weight:500; text-decoration:none; border-bottom:1px solid transparent;
  }
  .link:hover{border-bottom-color:var(--accent-line)}
  .ic-arrow{transition:transform .15s var(--ease)}
  .link:hover .ic-arrow{transform:translateX(3px)}

  .foot{
    margin-top:auto; min-height:60px; flex:none; background:var(--bg-soft);
    border-top:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:10px 32px; font-size:var(--fs-sm); color:var(--ink-3); flex-wrap:wrap;
  }
  .foot-left, .foot-right{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
  .foot .fi{display:inline-flex; align-items:center; gap:6px; cursor:pointer}
  .foot .fi:hover{color:var(--ink-2); text-decoration:none}

  /* ===================== 7. 首页 Hero ===================== */
  .hero{display:flex; gap:44px; padding:4px 0 0}
  .hero .left{flex:3; min-width:0; display:flex; flex-direction:column; gap:16px}
  .eyebrow{
    display:inline-flex; align-items:center; gap:7px; font-size:var(--fs-xs); font-weight:600;
    color:var(--ok-ink); background:var(--ok-bg); border:1px solid var(--ok-line);
    border-radius:var(--r-pill); padding:3px 12px; width:fit-content;
  }
  .eyebrow .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok-dot);box-shadow:0 0 8px var(--ok-dot)}
  .name{font-size:44px; font-weight:700; line-height:1.14; letter-spacing:-.028em}
  .direction{font-size:var(--fs-lg); color:var(--ink-2); font-weight:500; line-height:1.55}
  .focus{
    font-size:var(--fs-sm); color:var(--ink-2); display:flex; align-items:flex-start; gap:10px;
    background:var(--bg-soft); border-left:3px solid var(--accent); border-radius:0 var(--r-sm) var(--r-sm) 0;
    padding:11px 14px; line-height:1.65;
  }
  .focus .ic{margin-top:3px; color:var(--accent-ink)}
  .stat-row{display:flex; gap:12px}
  .stat{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:13px 15px; box-shadow:var(--sh-1);
  }
  .stat .v{font-size:var(--fs-2xl); font-weight:700; line-height:1.1; font-family:var(--mono); letter-spacing:-.02em; color:var(--ink)}
  .stat .l{font-size:var(--fs-xs); color:var(--ink-3); margin-top:4px}
  .contact{
    display:flex; align-items:center; gap:14px; padding:10px 14px; font-size:var(--fs-sm);
    color:var(--ink-2); background:var(--bg-soft); border:1px solid var(--line);
    border-radius:var(--r-sm); flex-wrap:wrap;
  }

  .hero .right{flex:2.15; min-width:0; display:flex; flex-direction:column; gap:13px}
  .ocean-panel{
    position:relative; isolation:isolate; min-height:218px; overflow:hidden;
    border:1px solid var(--line); border-radius:var(--r-lg);
    background:var(--surface); display:flex; flex-direction:column; justify-content:flex-end;
  }
  .ocean-preview{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .ocean-caption{
    position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 14px; background:rgba(10,12,18,.68); border-top:1px solid var(--line);
    font-size:var(--fs-xs); color:var(--ink-3); backdrop-filter:blur(8px);
  }
  .ocean-caption code{font-family:var(--mono); color:var(--accent-ink)}

  .recent{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:6px 8px; box-shadow:var(--sh-1);
  }
  .recent .row{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--r-sm);
    cursor:pointer; transition:background .13s var(--ease);
  }
  .recent .row + .row{border-top:1px solid var(--line)}
  .recent .row:hover{background:var(--bg-soft)}
  .recent .row .ti{
    width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft); color:var(--accent-ink);
  }
  .recent .row .tx{flex:1; min-width:0; font-size:var(--fs-sm); line-height:1.42}
  .recent .row .tx .k{font-size:11px; color:var(--ink-4); display:block; font-weight:600; font-family:var(--mono)}
  .recent .row .dt{font-size:11px; color:var(--ok-ink); background:var(--ok-bg); border:1px solid var(--ok-line); padding:1px 7px; border-radius:var(--r-pill); flex:none}
  .recent .row:hover .ic-arrow{transform:translateX(3px)}
  .recent .row .ic-arrow{color:var(--ink-4); transition:transform .15s var(--ease)}

  /* ===================== 8. 表格 / 正文段 / 代码 ===================== */
  .tbl-wrap{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface); box-shadow:var(--sh-1)}
  .tbl{width:100%; border-collapse:separate; border-spacing:0; font-size:var(--fs-sm)}
  .tbl th,.tbl td{padding:12px 14px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle}
  .tbl thead th{
    background:var(--bg-soft); border-bottom:1px solid var(--line-2);
    font-size:var(--fs-xs); font-weight:700; color:var(--ink-3);
    letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;
  }
  .tbl tbody tr.clickable{cursor:pointer; transition:background .13s var(--ease)}
  .tbl tbody tr.clickable:hover{background:var(--accent-soft)}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl td.num{font-variant-numeric:tabular-nums; white-space:nowrap; font-family:var(--mono)}
  .tbl td.strong{font-weight:700; color:var(--accent-ink); font-size:var(--fs-base)}
  .tbl .id{font-family:var(--mono); font-size:var(--fs-xs); color:var(--ink-3); white-space:nowrap}
  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .scrollx table{min-width:640px}

  .seg{
    border:1px solid var(--line); border-radius:var(--r); padding:15px 18px;
    background:var(--surface); display:flex; gap:13px; box-shadow:var(--sh-1);
  }
  .seg.req{background:var(--bg-soft); border-left:3px solid var(--accent)}
  .seg .no{
    width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:var(--fs-xs); font-weight:700; font-family:var(--mono);
    background:var(--accent); color:#fff; margin-top:2px;
  }
  .seg .bd{flex:1; min-width:0}
  .seg .h{display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap}
  .seg .h b{font-size:var(--fs-base); color:var(--ink)}
  .seg p{font-size:var(--fs-base); color:var(--ink-2); max-width:78ch; line-height:1.72}

  .nf{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:64px 20px; text-align:center}
  .nf .big{
    font-size:92px; font-weight:700; line-height:1; letter-spacing:-.04em;
    color:transparent; -webkit-text-stroke:2px var(--line-2);
  }

  /* ===================== 9. 搜索浮层 ===================== */
  .overlay{
    position:fixed; inset:0; z-index:100; background:rgba(10,12,18,.48); backdrop-filter:blur(4px);
    display:none; overflow:auto; padding:84px 18px 18px;
  }
  .overlay.show{display:block}
  .ov-box{
    max-width:660px; margin:0 auto; background:rgba(14,18,26,.92); border:1px solid var(--line-2);
    border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--sh-3);
  }
  .ov-top{display:flex; align-items:center; gap:11px; padding:14px 16px; border-bottom:1px solid var(--line)}
  .ov-top .ic{color:var(--ink-4); width:18px;height:18px}
  .ov-top input{flex:1; min-width:0; border:0; outline:0; font:inherit; font-size:var(--fs-md); background:transparent; color:var(--ink)}
  .ov-top input::placeholder{color:var(--ink-4)}
  .ov-top .esc{
    font-size:11px; color:var(--ink-3); border:1px solid var(--line); border-radius:var(--r-xs);
    padding:2px 7px; font-family:var(--mono); background:var(--bg-soft);
  }
  .ov-list{max-height:400px; overflow:auto; padding:8px}
  .ov-grp{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4); padding:10px 12px 5px}
  .ov-item{
    padding:10px 12px; border-radius:var(--r-sm); cursor:pointer; display:flex; align-items:center; gap:11px;
    width:100%; text-align:left; background:none; border:0; font:inherit; color:inherit;
    transition:background .13s var(--ease);
  }
  .ov-item:hover, .ov-item:focus-visible{background:var(--accent-soft); outline:none}
  .ov-item .ti{
    width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--bg-sunken); color:var(--accent-ink);
  }
  .ov-item .t{font-size:var(--fs-base); color:var(--ink); line-height:1.45; font-weight:500}
  .ov-item .d{font-size:var(--fs-xs); color:var(--ink-3)}
  .ov-item .ic-arrow{margin-left:auto; color:var(--ink-4)}
  .ov-item mark{background:rgba(168,110,18,.28); color:#ffe0a1; border-radius:2px; padding:0 2px}
  .ov-none{padding:30px; text-align:center; color:var(--ink-3); font-size:var(--fs-sm)}
  .ov-foot{
    padding:9px 16px; border-top:1px solid var(--line); background:var(--bg-soft);

const NAV = [
  {k:'home', t:'首页'},

  {k:'roadmap', t:'造物路线 · Roadmap'},
  {k:'about', t:'关于 · About'}

function buildHash(r){
  const p = r.page, q = r.params || {};
  switch(p){
    case 'home':    return '#/';
    case 'works':
    case 'labs':    return '#/works';
    case 'tool':    return `#/tool/${q.id || 'cleanpaste'}`;
    case 'notes':   return q.cat ? `#/notes/${encodeURIComponent(q.cat)}` : '#/notes';
    case 'note':    return `#/note/${q.slug || 'cleanpaste-pm-review'}`;
    case 'roadmap': return '#/roadmap';
    case 'now':     return '#/now';
    case 'about':   return '#/about';
    default:        return '#/404';
  }
}

function parseHash(h){
  const s = (h || '').replace(/^#/, '');
  if(!s || s === '/') return {page:'home', params:{}};
  let m;
  if((m = s.match(/^\/tool\/([a-z0-9-]+)$/i))) return {page:'tool', params:{id:m[1].toLowerCase()}};
  if((m = s.match(/^\/lab\/([a-z0-9-]+)$/i)))  return {page:'tool', params:{id:m[1].toLowerCase()}};
  if((m = s.match(/^\/notes\/([^/]+)$/i)))     return {page:'notes', params:{cat:decodeURIComponent(m[1])}};
  if((m = s.match(/^\/note\/([a-z0-9-]+)$/i))) return {page:'note', params:{slug:m[1]}};
  if(s === '/works' || s === '/labs') return {page:'works', params:{}};
  if(s === '/notes')   return {page:'notes', params:{}};
  if(s === '/roadmap') return {page:'roadmap', params:{}};
  if(s === '/now')     return {page:'now', params:{}};
  if(s === '/about')   return {page:'about', params:{}};
  if(s === '/404')     return {page:'404', params:{}};
  return {page:'404', params:{}, bad:'#' + s};
}

const routeKey = r => r.page + '|' +
  (((r.params && (r.params.slug || r.params.id || r.params.cat)) || '')) + '|' + (r.bad || '');

const TITLE = {
  home:'首页',
  works:'作品集 · LiteKit 效率四件套',
  notes:'产品复盘 · 痛点拆解与迭代思考',
  roadmap:'造物路线 · 从痛点到上线',
  now:'Now · 近期迭代动态',
  about:'About · 关于本站与造物原则',
  '404':'页面未找到'
};

function pageTitle(){
  if(route.page === 'tool' && window.LiteKitTools){
    const t = window.LiteKitTools.getTool(route.params.id);
    return t ? `${t.name} · ${t.cnName}` : '404';
  }
  if(route.page === 'note'){
    const n = PM_NOTES.find(x=>x.slug===route.params.slug);
    return n ? n.title : '404';
  }
  return TITLE[route.page] || '404';
}

function applyRoute(r, scroll){
  route = r;
  closeSearch();
  setDrawer(false);
  render();
  document.title = pageTitle() + ' · LiteKit 个人数字实验室';
  if(scroll !== false) window.scrollTo({top:0, behavior:'auto'});
}

function go(page, params){
  const h = buildHash({page, params: params || {}});
  if(location.hash === h) applyRoute(parseHash(h));
  else location.hash = h;
}

window.addEventListener('hashchange', ()=>{
  const next = parseHash(location.hash);
  if(routeKey(next) === routeKey(route)) return;
  applyRoute(next);
});

function decorateLinks(root){
  if(!root || !root.querySelectorAll) return;
  root.querySelectorAll('[data-go]').forEach(el=>{
    if(el.tagName !== 'A') return;
    const params = {};
    if(el.dataset.slug) params.slug = el.dataset.slug;
    if(el.dataset.id)   params.id   = el.dataset.id;
    if(el.dataset.cat)  params.cat  = el.dataset.cat;
    el.setAttribute('href', buildHash({page: el.dataset.go, params}));
  });
}

/* ================= 核心渲染入口 ================= */
function render(){
  if(window.LiteKitTools && typeof window.LiteKitTools.unmount === 'function'){
    window.LiteKitTools.unmount();
  }
  renderNav();
  renderSide();
  const map = {
    home: pageHome,
    works: pageWorks,
    labs: pageWorks,
    tool: pageTool,
    notes: pageNotes,
    note: pageNote,
    roadmap: pageRoadmap,
    now: pageNow,
    about: pageAbout,
    '404': page404
  };
  const main = document.getElementById('main');
  main.innerHTML = (map[route.page] || page404)();
  main.classList.remove('fade'); void main.offsetWidth; main.classList.add('fade');
  decorateLinks(document.getElementById('navLinks'));
  decorateLinks(document.getElementById('side'));
  decorateLinks(main);
  if(route.page === 'tool' && window.LiteKitTools && typeof window.LiteKitTools.mount === 'function'){
    window.LiteKitTools.mount(route.params.id);
    decorateLinks(main);
  }
}

/* ================= 抽屉与全局点击事件 ================= */
const burger = document.getElementById('burger');
const side = document.getElementById('side');
const mobile = matchMedia('(max-width: 900px)');

function setDrawer(open){
  document.body.classList.toggle('drawer-open', open);
  burger.setAttribute('aria-expanded', String(open));
  side.inert = mobile.matches && !open;
}
mobile.addEventListener('change', () => setDrawer(false));

document.addEventListener('click', (e)=>{
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;

  const wf = e.target.closest('[data-works-filter]');
  if(wf){
    worksFilter = wf.dataset.worksFilter;
    render();
    return;
  }

  const t = e.target.closest('[data-go]');
  if(t){
    e.preventDefault();
    const p = t.dataset.go;
    const params = {};
    if(t.dataset.slug) params.slug = t.dataset.slug;
    if(t.dataset.id)   params.id   = t.dataset.id;
    if(t.dataset.cat)  params.cat  = t.dataset.cat;
    go(p, params);
    return;
  }

  if(e.target.closest('#burger')){ setDrawer(!document.body.classList.contains('drawer-open')); return; }
  if(e.target.id==='scrim') setDrawer(false);
});

/* ================= 全局 ⌘K 搜索 ================= */
function getSearchIndex(){
  const tools = (window.LiteKitTools && window.LiteKitTools.TOOLS) || [];
  return [
    ...tools.map(t => ({
      type:'tool',
      t:`${t.name} · ${t.cnName}`,
      d:`${t.category} · ${t.tagline} · ${t.keywords || ''}`,
      go:'tool',
      id:t.id,
      icon:t.icon
    })),
    ...PM_NOTES.map(n => ({
      type:'note',
      t:n.title,
      d:`${n.topic} · ${n.tags.join(' ')} · ${n.summary}`,
      go:'note',
      slug:n.slug,
      icon:'bulb'
    })),
    ...ROADMAP_STAGES.map(s => ({
      type:'roadmap',
      t:s.name,
      d:s.goal,
      go:'roadmap',
      icon:'map'
    })),
    {type:'page', t:'作品集总览 · LiteKit Works', d:'浏览全部 4 款免登录在线效率工具', go:'works', icon:'layers'},
    {type:'page', t:'Now · 近期更新日志', d:'查看版本里程碑与当前聚焦动态', go:'now', icon:'clock'},
    {type:'page', t:'About · 关于本站与造物原则', d:'了解真痛点驱动与纯本地隐私安全设计', go:'about', icon:'info'}
  ];
}

const GRP_ORDER = ['tool', 'note', 'roadmap', 'page'];
const GRP_NAME = {tool:'在线效率工具（点开即用）', note:'产品设计复盘', roadmap:'造物演进阶段', page:'站点门户页面'};

const ov = document.getElementById('overlay');
const qEl = document.getElementById('q');
const ovList = document.getElementById('ovList');

function openSearch(){
  ov.classList.add('show');
  qEl.value = '';
  paintSearch('');
  qEl.focus();
}
function closeSearch(){
  if(!ov.classList.contains('show')) return;
  ov.classList.remove('show');
  document.getElementById('searchBtn').focus();
}
function paintSearch(kw){
  const all = getSearchIndex();
  const k = kw.trim().toLowerCase();
  const hits = k ? all.filter(i=>(i.t+' '+i.d).toLowerCase().includes(k)) : all.slice(0, 7);
  if(!hits.length){
    ovList.innerHTML = `<div class="ov-none">${ic('search')}<div style="margin-top:8px">没有找到与「${escHtml(kw)}」相关的工具或复盘。</div></div>`;
    return;
  }
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const mk = s => k
    ? s.split(new RegExp('('+esc(k)+')','ig')).map((part, i)=>i % 2 ? `<mark>${escHtml(part)}</mark>` : escHtml(part)).join('')
    : escHtml(s);
  let html = '';
  GRP_ORDER.forEach(g=>{
    const sub = hits.filter(h=>h.type===g);
    if(!sub.length) return;
    html += `<div class="ov-grp">${GRP_NAME[g]}</div>`;
    html += sub.map(h=>`<button type="button" class="ov-item" data-go="${h.go}" ${h.slug?`data-slug="${h.slug}"`:''} ${h.id?`data-id="${h.id}"`:''}>
      <span class="ti">${ic(h.icon,'sm')}</span>
      <span><span class="t">${mk(h.t)}</span><br><span class="d">${mk(h.d)}</span></span>
      ${ic('arrow-r','ic-arrow')}</button>`).join('');
  });
  ovList.innerHTML = html;
}

document.getElementById('searchBtn').addEventListener('click', openSearch);
qEl.addEventListener('input', e=>paintSearch(e.target.value));
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(ov.classList.contains('show')){ closeSearch(); return; }
    if(document.body.classList.contains('zen-ocean') && window.LiteKitTools){
      window.LiteKitTools.exitZenMode();
      return;
    }
    if(document.body.classList.contains('drawer-open')){
      setDrawer(false);
      burger.focus();
    }
    return;
  }
  if(ov.classList.contains('show')){
    const items = [...ovList.querySelectorAll('.ov-item')];
    if(e.key==='Enter' && e.target===qEl && items.length){
      e.preventDefault();
      items[0].click();
    }
    if((e.key==='ArrowDown' || e.key==='ArrowUp') && items.length){
      e.preventDefault();
      const controls = [qEl, ...items];
      const index = controls.indexOf(document.activeElement);
      const step = e.key==='ArrowDown' ? 1 : -1;
      controls[(index + step + controls.length) % controls.length].focus();
    }
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); }
});
ov.addEventListener('click', e=>{ if(e.target===ov) closeSearch(); });

/* ================= 启动渲染 ================= */
try{ if(!location.hash) history.replaceState(null, '', '#/'); }catch(e){}
applyRoute(parseHash(location.hash || '#/'), false);
