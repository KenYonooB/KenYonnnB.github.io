<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KenYonooB 的学习档案</title>
<meta name="description" content="KenYonooB 的 AI Infra 学习档案，包含学习路线、技术笔记、动手实验与个人简历。" />
<style>
  /* ===================== 1. 设计令牌 ===================== */
  :root{
    color-scheme: light dark;
    /* 中性色阶 */
    --bg:#FFFFFF; --bg-soft:#F7F8FB; --bg-sunken:#F1F3F7; --surface:#FFFFFF;
    --ink:#151B26; --ink-2:#48525F; --ink-3:#77818F; --ink-4:#A3ABB7;
    --line:#E5E9F0; --line-2:#D4DAE4;
    /* 品牌主色 */
    --accent:#2B5CE6; --accent-hover:#1E48C4; --accent-ink:#1B3FA8;
    --accent-soft:#EDF2FF; --accent-line:#C9D8FB;
    /* 语义色 */
    --ok-bg:#E7F5EC; --ok-line:#B4DCC2; --ok-ink:#1C6B3C; --ok-dot:#18A34A;
    --do-bg:#EDF2FF; --do-line:#C9D8FB; --do-ink:#1B3FA8; --do-dot:#2B5CE6;
    --pd-bg:#FFF6E4; --pd-line:#F0D7A4; --pd-ink:#8A5714; --pd-dot:#E0931B;
    --df-bg:#F1F3F7; --df-line:#DCE1EA; --df-ink:#69727E; --df-dot:#9AA3AF;
    --wn-bg:#FDECEC; --wn-line:#F2C3C3; --wn-ink:#8C2E2E;
    /* 代码区（固定深底，不随主题反转） */
    --code-bg:#12161F; --code-ink:#D7DEEA; --code-dim:#7C8798;
    --code-key:#7FB0FF; --code-str:#9BD3A0; --code-num:#F0C878;
    /* 字体 */
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;
    /* 字号 */
    --fs-xs:12px; --fs-sm:13px; --fs-base:15px; --fs-md:16px;
    --fs-lg:18px; --fs-xl:21px; --fs-2xl:26px; --fs-3xl:34px;
    /* 圆角 / 阴影 */
    --r-xs:5px; --r-sm:7px; --r:10px; --r-lg:14px; --r-pill:99px;
    --sh-1:0 1px 2px rgba(16,24,40,.05);
    --sh-2:0 2px 8px rgba(16,24,40,.07);
    --sh-3:0 12px 32px rgba(16,24,40,.12);
    --ease:cubic-bezier(.4,0,.2,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1219; --bg-soft:#121721; --bg-sunken:#0A0E14; --surface:#151B26;
      --ink:#E7EBF3; --ink-2:#A6B0C0; --ink-3:#7C8698; --ink-4:#5C6675;
      --line:#242C39; --line-2:#313B4B;
      --accent:#7C9BFF; --accent-hover:#93AEFF; --accent-ink:#B9C8FF;
      --accent-soft:#182136; --accent-line:#2C3C63;
      --ok-bg:#12261A; --ok-line:#2A5638; --ok-ink:#7FD49B; --ok-dot:#35C46B;
      --do-bg:#182136; --do-line:#2C3C63; --do-ink:#A9C0FF; --do-dot:#7C9BFF;
      --pd-bg:#2A2110; --pd-line:#5C4820; --pd-ink:#F0C878; --pd-dot:#E0A32B;
      --df-bg:#171D28; --df-line:#2A3240; --df-ink:#9AA4B3; --df-dot:#6B7482;
      --wn-bg:#2A1517; --wn-line:#5C2A2E; --wn-ink:#F0A0A0;
      --sh-1:0 1px 2px rgba(0,0,0,.40);
      --sh-2:0 2px 8px rgba(0,0,0,.45);
      --sh-3:0 12px 32px rgba(0,0,0,.55);
    }
  }

  /* ===================== 2. 基础 ===================== */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#F0F2F6; color:var(--ink); font-family:var(--sans);
    font-size:var(--fs-base); line-height:1.75; -webkit-font-smoothing:antialiased;
    transition:background .2s var(--ease);
  }
  @media (prefers-color-scheme: dark){ body{background:#080B10} }
  a{color:var(--accent-ink); text-decoration:none}
  a:hover{text-decoration:underline}
  /* 组件化的 <a>（按钮 / 卡片 / 列表行 / logo）保持观感，不做下划线 */
  a.btn:hover, a.card:hover, a.row:hover, a.link:hover, a.logo:hover{text-decoration:none}
  a.card, a.row, a.logo{color:inherit}
  a.card{display:block}
  h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.011em}
  p{margin:0}
  .ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;
      stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  .ic.sm{width:14px;height:14px;stroke-width:2}
  .ic.lg{width:19px;height:19px;stroke-width:1.7}
  .ic.fill{fill:currentColor;stroke:none}

  /* ===================== 4. 画布 ===================== */
  .stage{padding:28px 18px 80px; display:flex; justify-content:center}
  .screen{
    width:1280px; max-width:100%; background:var(--bg); border:1px solid var(--line);
    border-radius:var(--r-lg); overflow:hidden; display:flex; flex-direction:column;
    box-shadow:var(--sh-3);
  }
  /* ===================== 5. 顶部导航 ===================== */
  .nav{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:0 32px; height:66px; background:var(--bg);
    border-bottom:1px solid var(--line); flex:none;
  }
  .nav .logo{white-space:nowrap; display:flex; align-items:center; gap:10px; font-weight:700; font-size:var(--fs-lg); letter-spacing:-.015em}
  .nav .logo .mark{
    width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
    font-family:var(--mono); letter-spacing:0;
  }
  .nav .links{display:flex; gap:4px; align-items:center}
  .nav .links a{
    color:var(--ink-2); font-size:var(--fs-base); padding:6px 12px; border-radius:var(--r-sm);
    cursor:pointer; transition:background .15s var(--ease), color .15s var(--ease);
  }
  .nav .links a:hover{background:var(--bg-soft); color:var(--ink); text-decoration:none}
  .nav .links a.cur{color:var(--accent-ink); font-weight:600; background:var(--accent-soft)}
  .nav .right{display:flex; gap:10px; align-items:center}
  .search{
    width:230px; height:38px; border-radius:var(--r-pill); background:var(--bg-soft);
    border:1px solid var(--line); display:flex; align-items:center; gap:8px;
    padding:0 12px 0 14px; color:var(--ink-3); font-size:var(--fs-sm);
    cursor:pointer; text-align:left; font-family:inherit;
    transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .search:hover{border-color:var(--line-2); color:var(--ink-2); background:var(--bg-sunken)}
  .search .kbd{
    margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-4);
    border:1px solid var(--line); border-radius:var(--r-xs); padding:1px 5px; background:var(--bg);
  }
  .icon-btn{
    width:38px;height:38px;border-radius:var(--r-pill);background:var(--bg-soft);
    border:1px solid var(--line); color:var(--ink-2); cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .icon-btn:hover{border-color:var(--line-2); color:var(--ink); background:var(--bg-sunken)}
  .burger{display:none}
  /* ===================== 6. 侧栏 ===================== */
  .body{display:flex; flex:1; min-height:780px}
  .side{
    width:256px; flex:none; padding:22px 14px 22px 18px; background:var(--bg-soft);
    border-right:1px solid var(--line); font-size:var(--fs-sm); color:var(--ink-2);
  }
  .side .grp{
    font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--ink-4); margin:20px 0 6px; padding-left:10px;
  }
  .side .grp:first-child{margin-top:0}
  .side a{
    display:flex; align-items:center; gap:7px; color:var(--ink-2); padding:6px 10px;
    border-radius:var(--r-sm); cursor:pointer; position:relative; line-height:1.5;
    transition:background .13s var(--ease), color .13s var(--ease);
  }
  .side a:hover{background:var(--bg-sunken); color:var(--ink); text-decoration:none}
  .side a.ind1{padding-left:20px}
  .side a.ind2{padding-left:32px; font-size:var(--fs-xs); color:var(--ink-3)}
  .side a.cur{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
  .side a.cur::before{
    content:''; position:absolute; left:0; top:6px; bottom:6px; width:3px;
    border-radius:0 3px 3px 0; background:var(--accent);
  }
  .side .cnt{margin-left:auto; font-size:11px; color:var(--ink-4); font-family:var(--mono)}
  .scrim{display:none}
  .main{flex:1; min-width:0; padding:34px 40px 44px; display:flex; flex-direction:column; gap:16px}
  /* ===================== 7. 通用元件 ===================== */
  .crumb{display:flex; align-items:center; gap:6px; font-size:var(--fs-sm); color:var(--ink-3)}
  .crumb .ic{width:13px;height:13px}
  h1.page{font-size:var(--fs-2xl); line-height:1.3; margin:0}
  .lead{font-size:var(--fs-base); color:var(--ink-3); margin:0; max-width:74ch; line-height:1.7}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:18px 20px; box-shadow:var(--sh-1); transition:box-shadow .18s var(--ease), border-color .18s var(--ease);
  }
  .card.hl{background:var(--accent-soft); border-color:var(--accent-line); box-shadow:none}
  .card.plain{background:var(--bg-soft); box-shadow:none}
  .card.linkable{cursor:pointer}
  .card.linkable:hover{border-color:var(--line-2); box-shadow:var(--sh-2)}
  .card h3{font-size:var(--fs-md); margin-bottom:6px}
  .card .meta{font-size:var(--fs-sm); color:var(--ink-3)}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .sec-h{display:flex; align-items:center; gap:8px; font-size:var(--fs-sm); font-weight:600; color:var(--ink-2)}
  .lbl-c{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-4)}

  /* 标签 pill */
  .tag{
    display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-xs); font-weight:500;
    padding:2px 9px; border-radius:var(--r-pill); border:1px solid var(--line);
    color:var(--ink-2); background:var(--bg-soft); white-space:nowrap;
  }
  .tag .d{width:6px;height:6px;border-radius:99px;background:currentColor;flex:none}
  .tag.done{background:var(--ok-bg); border-color:var(--ok-line); color:var(--ok-ink)}
  .tag.doing{background:var(--do-bg); border-color:var(--do-line); color:var(--do-ink)}
  .tag.todo{background:var(--df-bg); border-color:var(--df-line); color:var(--df-ink)}
  .tag.draft{background:var(--df-bg); border-color:var(--df-line); color:var(--df-ink)}
  .tag.pending{background:var(--pd-bg); border-color:var(--pd-line); color:var(--pd-ink)}

  /* 按钮 */
  .btn{
    font:inherit; font-size:var(--fs-md); height:46px; min-width:168px; padding:0 20px;
    border-radius:var(--r-sm); border:1px solid transparent; cursor:pointer; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:background .15s var(--ease), border-color .15s var(--ease), transform .1s var(--ease);
  }
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent); color:#fff}
  .btn.primary:hover{background:var(--accent-hover); text-decoration:none}
  .btn.ghost{background:var(--bg); color:var(--ink); border-color:var(--line-2)}
  .btn.ghost:hover{background:var(--bg-soft); border-color:var(--ink-4); text-decoration:none}
  .btns{display:flex; gap:12px; flex-wrap:wrap}
  .link{
    color:var(--accent-ink); cursor:pointer; display:inline-flex; align-items:center; gap:5px;
    font-weight:500; text-decoration:none; border-bottom:1px solid transparent;
  }
  .link:hover{border-bottom-color:var(--accent-line)}
  .ic-arrow{transition:transform .15s var(--ease)}
  .link:hover .ic-arrow{transform:translateX(3px)}

  .foot{
    margin-top:auto; height:62px; flex:none; background:var(--bg-soft);
    border-top:1px solid var(--line); display:flex; align-items:center; gap:16px;
    padding:0 32px; font-size:var(--fs-sm); color:var(--ink-3); flex-wrap:wrap;
  }
  .foot .fi{display:inline-flex; align-items:center; gap:6px; cursor:pointer}
  .foot .fi:hover{color:var(--ink-2)}

  /* ===================== 8. 首页 ===================== */
  .hero{display:flex; gap:52px; padding:6px 0 0}
  .hero .left{flex:3; min-width:0; display:flex; flex-direction:column; gap:17px}
  .eyebrow{
    display:inline-flex; align-items:center; gap:7px; font-size:var(--fs-xs); font-weight:600;
    color:var(--accent-ink); background:var(--accent-soft); border:1px solid var(--accent-line);
    border-radius:var(--r-pill); padding:3px 12px; width:fit-content;
  }
  .name{font-size:52px; font-weight:700; line-height:1.06; letter-spacing:-.03em}
  .direction{font-size:var(--fs-xl); font-weight:600; line-height:1.5; letter-spacing:-.015em}
  .focus{
    font-size:var(--fs-md); color:var(--ink-2); display:flex; align-items:flex-start; gap:9px;
    background:var(--bg-soft); border-left:3px solid var(--accent); border-radius:0 var(--r-sm) var(--r-sm) 0;
    padding:11px 14px;
  }
  .focus .ic{margin-top:4px; color:var(--accent)}
  .stat-row{display:flex; gap:12px}
  .stat{
    flex:1; background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:14px 16px; box-shadow:var(--sh-1);
  }
  .stat .v{font-size:var(--fs-2xl); font-weight:700; line-height:1.1; font-family:var(--mono); letter-spacing:-.02em}
  .stat .l{font-size:var(--fs-xs); color:var(--ink-3); margin-top:2px}
  .contact{
    display:flex; align-items:center; gap:8px; padding:10px 14px; font-size:var(--fs-sm);
    color:var(--ink-2); background:var(--bg-soft); border:1px solid var(--line);
    border-radius:var(--r-sm); flex-wrap:wrap;
  }

  .hero .right{flex:2; min-width:0; display:flex; flex-direction:column; gap:14px}
  .recent{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
    padding:6px 8px; box-shadow:var(--sh-1);
  }
  .recent .row{
    display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:var(--r-sm);
    cursor:pointer; transition:background .13s var(--ease);
  }
  .recent .row + .row{border-top:1px solid var(--line)}
  .recent .row:hover{background:var(--bg-soft)}
  .recent .row .ti{
    width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
    background:var(--accent-soft); color:var(--accent-ink);
  }
  .recent .row .tx{flex:1; min-width:0; font-size:var(--fs-sm); line-height:1.5}
  .recent .row .tx .k{font-size:11px; color:var(--ink-4); display:block; font-weight:600; letter-spacing:.05em}
  .recent .row .dt{font-size:var(--fs-xs); color:var(--ink-4); font-family:var(--mono); flex:none}
  .recent .row:hover .ic-arrow{transform:translateX(3px)}
  .recent .row .ic-arrow{color:var(--ink-4); transition:transform .15s var(--ease)}

  /* ===================== 9. 表格 ===================== */
  .tbl-wrap{border:1px solid var(--line); border-radius:var(--r); overflow:hidden; background:var(--surface); box-shadow:var(--sh-1)}
  .tbl{width:100%; border-collapse:separate; border-spacing:0; font-size:var(--fs-sm)}
  .tbl th,.tbl td{padding:12px 14px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle}
  .tbl thead th{
    background:var(--bg-soft); border-bottom:1px solid var(--line-2);
    font-size:var(--fs-xs); font-weight:700; color:var(--ink-3);
    letter-spacing:.06em; text-transform:uppercase; white-space:nowrap;
  }
  .tbl tbody tr{cursor:pointer; transition:background .13s var(--ease)}
  .tbl tbody tr:hover{background:var(--accent-soft)}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl td.num{font-variant-numeric:tabular-nums; white-space:nowrap; font-family:var(--mono)}
  .tbl td.strong{font-weight:700; color:var(--accent-ink); font-size:var(--fs-base)}
  .tbl td.weak{color:var(--ink-4)}
  .tbl .id{font-family:var(--mono); font-size:var(--fs-xs); color:var(--ink-3); white-space:nowrap}
  .scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch}
  .scrollx table{min-width:660px}

  /* ===================== 10. 正文段 / 代码 / 环境 ===================== */
  .seg{
    border:1px solid var(--line); border-radius:var(--r); padding:14px 16px 14px 15px;
    background:var(--surface); display:flex; gap:13px; box-shadow:var(--sh-1);
  }
  .seg.req{background:var(--bg-soft); border-left:3px solid var(--accent)}
  .seg.miss{border-style:dashed; border-left-style:dashed; border-left-color:var(--line-2); background:transparent; box-shadow:none}
  .seg .no{
    width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
    font-size:var(--fs-xs); font-weight:700; font-family:var(--mono);
    background:var(--bg-sunken); color:var(--ink-3); margin-top:2px;
  }
  .seg.req .no{background:var(--accent); color:#fff}
  .seg .bd{flex:1; min-width:0}
  .seg .h{display:flex; align-items:center; gap:8px; margin-bottom:3px; flex-wrap:wrap}
  .seg .h b{font-size:var(--fs-base); color:var(--ink)}
  .seg .h .reqd{font-size:11px; padding:1px 7px; border-radius:var(--r-pill); font-weight:600}
  .seg .h .reqd.y{background:var(--accent-soft); color:var(--accent-ink); border:1px solid var(--accent-line)}
  .seg .h .reqd.n{background:var(--bg-sunken); color:var(--ink-3); border:1px solid var(--line)}
  .seg p{font-size:var(--fs-base); color:var(--ink-2); max-width:76ch}
  .seg.miss p{color:var(--ink-4)}

  .code{position:relative; border-radius:var(--r); overflow:hidden; background:var(--code-bg); box-shadow:var(--sh-2)}
  .code .top{
    display:flex; align-items:center; gap:8px; padding:9px 14px; background:#0D1118;
    border-bottom:1px solid #1E2531;
  }
  .code .top .lang{font-family:var(--mono); font-size:11px; color:var(--code-dim); letter-spacing:.06em}
  .code .cp{
    margin-left:auto; font-size:var(--fs-xs); padding:5px 10px; border-radius:var(--r-xs);
    background:#232B3A; color:#B7C0D0; border:1px solid #2E3747; cursor:pointer; font-family:inherit;
    display:inline-flex; align-items:center; gap:5px; transition:background .15s var(--ease), color .15s var(--ease);
  }
  .code .cp:hover{background:#2C3547; color:#fff}
  pre{
    background:var(--code-bg); color:var(--code-ink); padding:15px 18px; margin:0;
    font-family:var(--mono); font-size:13px; line-height:1.78; overflow-x:auto;
  }
  .tk-p{color:var(--code-key); font-weight:600}   /* $ 提示符 */
  .tk-n{color:var(--code-num)}                     /* 数字 */
  .tk-c{color:var(--code-dim)}                     /* 注释 / 次要 */

  .env{
    background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:var(--r);
    padding:15px 17px; font-size:var(--fs-sm);
  }
  .env .k{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-4); margin-bottom:9px; display:flex; align-items:center; gap:6px}
  .env .grid{display:flex; flex-wrap:wrap; gap:8px}
  .env .cell{
    background:var(--surface); border:1px solid var(--accent-line); border-radius:var(--r-sm);
    padding:8px 12px; font-family:var(--mono); font-size:var(--fs-xs); color:var(--ink-2);
  }
  .env .honest{
    margin-top:11px; display:flex; align-items:flex-start; gap:8px; font-size:var(--fs-xs);
    color:var(--pd-ink); background:var(--pd-bg); border:1px solid var(--pd-line);
    border-radius:var(--r-sm); padding:8px 11px;
  }
  .chk{display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-xs)}
  .chk .box{
    width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line-2);flex:none;
    display:flex;align-items:center;justify-content:center;background:var(--surface);
  }
  .chk.on .box{background:var(--accent); border-color:var(--accent); color:#fff}
  .warn{
    background:var(--wn-bg); border:1px solid var(--wn-line); color:var(--wn-ink);

/* ---------------------------------------------------------------
   URL 方案（单一数据源 = 地址栏 hash）
     #/                     首页
     #/roadmap #/now #/labs 门户页
     #/notes                笔记索引（全部）
     #/notes/<stage-key>    按阶段过滤，如 #/notes/parallel
     #/note/<slug>          单篇笔记
     #/labs                 实验索引
     #/lab/<id>             实验详情，如 #/lab/L-002
     #/404                  404
   其它任何 hash → 解析失败 → 404
   --------------------------------------------------------------- */
function buildHash(r){
  const p = r.page, q = r.params || {};
  switch(p){
    case 'home':    return '#/';
    case 'roadmap': return '#/roadmap';
    case 'now':     return '#/now';
    case 'labs':    return '#/labs';
    case 'notes':   return q.cat ? `#/notes/${q.cat}` : '#/notes';
    case 'note':    return `#/note/${q.slug || 'why-padding-3x'}`;
    case 'lab':     return `#/lab/${q.id || 'L-002'}`;
    case 'about':   return '#/about';
    default:        return '#/404';
  }
}
function parseHash(h){
  const s = (h || '').replace(/^#/, '');
  if(!s || s === '/') return {page:'home', params:{}};
  let m;
  if((m = s.match(/^\/notes\/([a-z0-9-]+)$/i)))  return {page:'notes', params:{cat:m[1]}};
  if((m = s.match(/^\/note\/([a-z0-9-]+)$/i)))   return {page:'note',  params:{slug:m[1]}};
  if((m = s.match(/^\/lab\/([A-Za-z0-9-]+)$/i))) return {page:'lab',   params:{id:m[1]}};
  if(s === '/notes')   return {page:'notes', params:{}};
  if(s === '/labs')    return {page:'labs',  params:{}};
  if(s === '/roadmap') return {page:'roadmap', params:{}};
  if(s === '/now')     return {page:'now', params:{}};
  if(s === '/about')   return {page:'about', params:{}};
  if(s === '/404')     return {page:'404', params:{}};
  return {page:'404', params:{}, bad:'#' + s};      // 无法解析 → 404
}
/* 用于幂等判断：同一地址不重复渲染 */
const routeKey = r => r.page + '|' +
  (((r.params && (r.params.slug || r.params.id || r.params.cat)) || '')) + '|' + (r.bad || '');

function applyRoute(r, scroll){
  route = r;
  closeSearch();
  setDrawer(false);
  render();
  document.title = pageTitle() + ' · KenYonooB 的学习档案';
  if(scroll !== false) window.scrollTo({top:0, behavior:'auto'});
}
function go(page, params){
  const h = buildHash({page, params: params || {}});
  if(location.hash === h) applyRoute(parseHash(h));  // 同址点击也要重绘
  else location.hash = h;                             // 交给 hashchange 统一渲染
}
window.addEventListener('hashchange', ()=>{
  const next = parseHash(location.hash);
  if(routeKey(next) === routeKey(route)) return;     // 幂等：避免自己写 hash 时重复渲染
  applyRoute(next);
});
/* 页面标题跟随路由（真实站点行为，便于区分浏览器标签页） */

               labs:'Labs · 动手实验', now:'Now · 现在在做什么', about:'About · 关于我', '404':'404'};
function pageTitle(){
  if(route.page === 'note'){
    const n = SRC === 'demo' && NOTES.find(x=>x.slug===route.params.slug);
    return n ? n.title : '404';
  }
  if(route.page === 'lab'){
    const l = SRC === 'demo' && LABS.find(x=>x.id===route.params.id);
    return l ? l.id+' '+l.title : '404';
  }
  return TITLE[route.page] || '404';
}
/* 给 <a data-go> 注入真实 href：支持右键「在新标签打开」与爬虫抓取 */
function decorateLinks(root){
  if(!root || !root.querySelectorAll) return;
  root.querySelectorAll('[data-go]').forEach(el=>{
    if(el.tagName !== 'A') return;
    const params = {};
    if(el.dataset.slug)  params.slug  = el.dataset.slug;
    if(el.dataset.id)    params.id    = el.dataset.id;
    if(el.dataset.cat) params.cat = el.dataset.cat;
    el.setAttribute('href', buildHash({page: el.dataset.go, params}));
  });
}

/* 代码块着色（极简 tokenizer，仅用于原型观感） */
function codeBlock(text, lang){
  const esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const body = esc.split('\n').map(line=>{
    if(/^\s*\$/.test(line)) return line.replace(/^(\s*)(\$)/, '$1<span class="tk-p">$2</span>');
    return line;
  }).join('\n').replace(/(\d[\d,]*)/g,'<span class="tk-n">$1</span>');
  return `<div class="code">
    <div class="top"><span class="lang">${lang||'bash'}</span>
      <button class="cp clickable" data-copy>${ic('copy','sm')}复制</button></div>
    <div class="scrollx"><pre>${body}</pre></div>
  </div>`;
}

const mobile = matchMedia('(max-width: 900px)');

function setDrawer(open){
  document.body.classList.toggle('drawer-open', open);
  burger.setAttribute('aria-expanded', String(open));
  side.inert = mobile.matches && !open;
}
mobile.addEventListener('change', () => setDrawer(false));

/* ================= 事件代理 ================= */
document.addEventListener('click', (e)=>{
  /* 带修饰键 / 非左键 → 不拦截，交给浏览器用 href 在新标签打开 */
  if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
  const t = e.target.closest('[data-go]');
  if(t){
    e.preventDefault();
    const p = t.dataset.go;
    const params = {};
    if(t.dataset.slug) params.slug = t.dataset.slug;
    if(t.dataset.id) params.id = t.dataset.id;
    if(t.dataset.cat) params.cat = t.dataset.cat;
    go(p, params);
    return;
  }
  const cp = e.target.closest('[data-copy]');
  if(cp){
    const pre = cp.closest('.code').querySelector('pre');
    navigator.clipboard && navigator.clipboard.writeText(pre.innerText);
    const old = cp.innerHTML;
    cp.innerHTML = ic('check-sm','sm')+'已复制';
    setTimeout(()=>cp.innerHTML = old, 1400);
    return;
  }
  if(e.target.closest('#toggleSilent')){
    NOW.silent = !NOW.silent; render(); return;
  }
  if(e.target.closest('#burger')){ setDrawer(!document.body.classList.contains('drawer-open')); return; }
  if(e.target.id==='scrim') setDrawer(false);
});

  ...(SRC === 'demo' ? NOTES : []).map(n=>({type:'note', t:n.title, d:n.topic+' · '+n.stage+' · '+n.tags.join(' '), go:'note', slug:n.slug, icon:'doc'})),

  ...(SRC === 'real' ? REAL.branches : []).map(b=>({type:'主题', t:b.name, d:b.desc, go:'notes', cat:b.id, icon:'doc'})),
  {type:'页面', t:'About · 关于我', d:'门户', go:'about', icon:'info'},
  {type:'页面', t:'Now · 现在在做什么', d:'门户', go:'now', icon:'target'},
  {type:'页面', t:'Roadmap · 六阶段学习路线', d:'门户', go:'roadmap', icon:'map'},
  {type:'页面', t:'Labs · 动手实验', d:'门户', go:'labs', icon:'flask'},
  {type:'页面', t:'Notes · 笔记档案', d:'门户', go:'notes', icon:'doc'}
];
const GRP_ORDER = ['note','lab','主题','路线','页面'];
const GRP_NAME = {note:'笔记', lab:'实验', '主题':'笔记主题', '路线':'路线节点', '页面':'页面'};

const ov = document.getElementById('overlay');
const qEl = document.getElementById('q');
const ovList = document.getElementById('ovList');

function openSearch(){
  ov.classList.add('show');
  qEl.value = '';
  paintSearch('');
  qEl.focus();
}
function closeSearch(){
  if(!ov.classList.contains('show')) return;
  ov.classList.remove('show');
  document.getElementById('searchBtn').focus();
}
function paintSearch(kw){
  const k = kw.trim().toLowerCase();
  const hits = k ? INDEX.filter(i=>(i.t+' '+i.d).toLowerCase().includes(k)) : INDEX.slice(0,6);
  if(!hits.length){
    ovList.innerHTML = `<div class="ov-none">${ic('search')}<div style="margin-top:8px">没有找到与「${escHtml(kw)}」匹配的结果。</div></div>`;
    return;
  }
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const mk = s => k
    ? s.split(new RegExp('('+esc(k)+')','ig')).map((part, i)=>i % 2 ? `<mark>${escHtml(part)}</mark>` : escHtml(part)).join('')
    : escHtml(s);
  let html = '';
  GRP_ORDER.forEach(g=>{
    const sub = hits.filter(h=>h.type===g);
    if(!sub.length) return;
    html += `<div class="ov-grp">${GRP_NAME[g]}</div>`;
    html += sub.map(h=>`<button class="ov-item" data-go="${h.go}" ${h.slug?`data-slug="${h.slug}"`:''} ${h.id?`data-id="${h.id}"`:''} ${h.cat?`data-cat="${h.cat}"`:''}>
      <span class="ti">${ic(h.icon,'sm')}</span>
      <span><span class="t">${mk(h.t)}</span><br><span class="d">${mk(h.d)}</span></span>
      ${ic('arrow-r','ic-arrow')}</button>`).join('');
  });
  ovList.innerHTML = html;
}
document.getElementById('searchBtn').addEventListener('click', openSearch);
qEl.addEventListener('input', e=>paintSearch(e.target.value));
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(ov.classList.contains('show')) closeSearch();
    else if(document.body.classList.contains('drawer-open')){
      setDrawer(false);
      burger.focus();
    }
    return;
  }
  if(ov.classList.contains('show')){
    const items = [...ovList.querySelectorAll('.ov-item')];
    if(e.key==='Enter' && e.target===qEl && items.length){
      e.preventDefault();
      items[0].click();
    }
    if((e.key==='ArrowDown' || e.key==='ArrowUp') && items.length){
      e.preventDefault();
      const controls = [qEl, ...items];
      const index = controls.indexOf(document.activeElement);
      const step = e.key==='ArrowDown' ? 1 : -1;
      controls[(index + step + controls.length) % controls.length].focus();
    }
  }
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); }
});
ov.addEventListener('click', e=>{ if(e.target===ov) closeSearch(); });

/* ================= 启动 ================= */
/* 首屏从 URL 恢复；无 hash 时补一个 #/（file:// 下 replaceState 可能抛错，忽略即可） */
document.body.classList.toggle('demo', SRC === 'demo');
document.getElementById('demoNotice').hidden = SRC !== 'demo';
if(SRC === 'demo'){
  const link = document.getElementById('demoLink');
  link.href = './#/';
  link.textContent = '返回学习档案';
}
try{ if(!location.hash) history.replaceState(null, '', '#/'); }catch(e){}
applyRoute(parseHash(location.hash || '#/'), false);
</script>
