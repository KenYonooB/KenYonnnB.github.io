# ========================================================================================
# LiteKit · 个人数字实验室与效率作品集
# ========================================================================================

url:                   ''
baseurl:               ''

# 通用设置
# ---------------------------------------------------------------------------------------
lang:                  zh-cn
title:                 LiteKit · 个人数字实验室
description:           捕捉日常高频痛点，构建免登录、纯本地运行的极简效率工具集与产品造物复盘。
tagline:               极简效率工具集与产品造物记录
keywords:              [Portfolio, Productivity Tools, AI Builder, Product Design, Web Tools]

# 侧边栏导航菜单
menu:
  - title:             作品集主页
    url:               /
  - title:             能力概览
    url:               /resume/
  - title:             关于本站
    url:               /about/

# 页脚版权信息
copyright:             "© LiteKit · 个人数字实验室"

# 文章永久链接格式
permalink:             /:categories/:year-:month-:day-:title/

# 分页
paginate:              10
paginate_path:         /:num/

# 主题
# ---------------------------------------------------------------------------------------
theme: jekyll-theme-hydejack

# 外观定制
# ----------------------------------------------------------------------------------------
accent_image:          none
accent_color:          '#b8ddff'
theme_color:           '#0a0a0b'

defaults:
  - scope:
      path:            assets/
    values:
      sitemap:         false

kramdown:
  math_engine:         katex
  math_engine_opts:    {}
  footnote_backlink:   '&#x21a9;&#xfe0e;'

# Hydejack 设置
# ----------------------------------------------------------------------------------------
hydejack:
  post_addons:         [about, related, random]
  project_addons:      [about, other]
  no_mark_external:    false
  no_push_state:       false
  no_drawer:           false
  no_navbar:           false
  no_search:           false
  no_inline_css:       false
  no_page_style:       false
  no_break_layout:     true
  no_toc:              false
  no_third_column:     false
  no_large_headings:   false
  no_structured_data:  false
  no_theme_color:      false
  no_breadcrumbs:      false
  use_lsi:             true
  cookies_banner:      false
  advertise:           false
  hide_dates:          false
  hide_last_modified:  false
  dark_mode:
    always:            true
    dynamic:           false
    icon:              false
  offline:
    enabled:           false
    cache_version:     14
    precache_assets:
      - /assets/img/swipe.svg

# Collections
# ----------------------------------------------------------------------------------------
collections:
  featured_categories:
    permalink:         /:name/
    output:            true
  featured_tags:
    permalink:         /tag-:name/
    output:            true
  projects:
    permalink:         /projects/:path/
    output:            true

# 文件排除/包含
# ----------------------------------------------------------------------------------------
exclude:
  - .jekyll-cache
  - .sass-cache
  - .ruby-lsp
  - .wrangler
  - '*.toml'
  - vendor
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
include:
  - _routes.json
  - .well-known

# 插件
# ----------------------------------------------------------------------------------------
plugins:
  - jekyll-default-layout
  - jekyll-feed
  - jekyll-optional-front-matter
  - jekyll-paginate
  - jekyll-readme-index
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jekyll-include-cache
  - jekyll-last-modified-at

# 插件配置
# ---------------------------------------------------------------------------------------
optional_front_matter:
  remove_originals:    true

readme_index:
  remove_originals:    true
  with_frontmatter:    true

relative_links:
  collections:         true

titles_from_headings:
  strip_title:         true
  collections:         true

compress_html:
  comments:            ["<!--", "-->"]
  clippings:           all
  endings:             all
  ignore:
    envs:              [development]

sass:
  style:               compressed
